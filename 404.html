<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Who Am I — 404</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=VT323&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;background:#0b0f0b radial-gradient(#1f3a1f 1px,transparent 1px) 0 0/12px 12px;color:#39ff14;font-family:'VT323',monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.tape{position:fixed;left:0;right:0;height:34px;background:repeating-linear-gradient(45deg,#ffd400 0 20px,#111 20px 40px)}.t{top:0}.b{bottom:0}
h1{font-family:'Bangers',Impact,sans-serif;font-size:clamp(48px,11vw,120px);color:#ffd400;margin:0;text-align:center;transform:rotate(-3deg);-webkit-text-stroke:3px #000;text-shadow:6px 6px 0 #ff2e63,10px 10px 0 #000;letter-spacing:3px}
.pow{font-family:'Bangers',Impact,sans-serif;background:#ff2e63;color:#fff;border:4px solid #000;padding:6px 18px;font-size:28px;transform:rotate(4deg);box-shadow:6px 6px 0 #000;margin:10px 0 24px}
.term{background:#000;border:4px solid #39ff14;box-shadow:8px 8px 0 #ffd400;width:min(640px,100%);padding:16px;font-size:22px;line-height:1.3}
.c::after{content:'█';animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
</style></head><body>
<div class="tape t"></div>
<h1>404!</h1>
<div class="pow">KA-BOOM! PAGE NOT FOUND</div>
<div class="term">
$ cd $REQUESTED_PAGE<br>&gt; bash: cd: No such file or directory<br>$ cd ~ <a href="/Who_Am_I/" style="color:#ffd400">[ return home ]</a><br>$ <span class="c"></span>
</div>
<div class="tape b"></div>
</body></html>
